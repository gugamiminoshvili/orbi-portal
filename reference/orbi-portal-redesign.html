<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ORBI Portal — News & My Apartments (Redesign)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ORBI PORTAL — SHARED DESIGN SYSTEM
   Tokens are the single source of truth for both flows + dashboard.
   ============================================================ */
:root{
  /* Brand + accent */
  --teal:#1A8A4E;          /* ORBI brand green (primary accent) */
  --teal-600:#146F3E;
  --teal-soft:#DCF3E5;     /* chip / badge background */
  --teal-ink:#0E6B3B;

  /* Surfaces */
  --bg:#EEF1F4;
  --card:#ffffff;
  --sidebar:#15663B;       /* ORBI dark green shell */
  --sidebar-2:#0E4A2A;
  --sidebar-hover:#1C7A48;
  --sidebar-active:#1A7044;

  /* Text */
  --ink:#1b1b2c;
  --ink-2:#3f425a;
  --muted:#7E8299;
  --line:#eceef4;
  --line-2:#e4e7f0;

  /* Semantic (replace meaningless colored stripes) */
  --pos:#1A8A4E;  --pos-bg:#DCF3E5;  --pos-ink:#0E6B3B;   /* paid / active / positive */
  --warn:#FFA800; --warn-bg:#FFF4DE; --warn-ink:#b57400;  /* pause / pending / warning */
  --neg:#F1416C;  --neg-bg:#FFE2EA;  --neg-ink:#c01e49;   /* overdue / negative balance */
  --info:#3699FF; --info-bg:#E1F0FF; --info-ink:#1d6fd0;

  /* Shape + depth */
  --r:16px;
  --r-sm:10px;
  --r-pill:999px;
  --shadow:0 4px 24px rgba(34,41,82,.06), 0 1px 3px rgba(34,41,82,.05);
  --shadow-lg:0 18px 50px rgba(20,24,60,.18);
  --ring:0 0 0 3px rgba(26,138,78,.28);

  /* Spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;

  --shell-w:264px;
  --header-h:68px;
  --t:.2s cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ---------- App shell layout ---------- */
.app{display:flex;min-height:100vh}

/* Sidebar (dark navy) — present on EVERY screen */
.sidebar{
  width:var(--shell-w);
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));
  color:#cdd0e6;
  position:fixed;inset:0 auto 0 0;
  display:flex;flex-direction:column;
  z-index:60;
  transition:transform var(--t);
}
.brand{display:flex;align-items:center;gap:12px;padding:22px 22px 18px}
.brand .logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--teal),#28a862);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;
  box-shadow:0 6px 16px rgba(26,138,78,.4);
}
.brand b{color:#fff;font-size:17px;font-weight:600;letter-spacing:.2px}
.brand span{display:block;color:#7c80a8;font-size:11px;font-weight:500;margin-top:1px}
.nav{padding:8px 14px;overflow-y:auto;flex:1}
.nav .group{color:#5d6191;font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:18px 12px 8px}
.nav a{
  display:flex;align-items:center;gap:13px;
  padding:11px 14px;border-radius:11px;color:#b6b9d8;font-weight:500;font-size:13.5px;
  margin-bottom:3px;transition:var(--t);cursor:pointer;
}
.nav a:hover{background:var(--sidebar-hover);color:#fff}
.nav a.active{background:var(--sidebar-active);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.nav a .ic{width:20px;height:20px;flex:none;opacity:.9}
.nav a.active .ic{color:var(--teal)}
.side-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:11px}
.side-foot .av{width:36px;height:36px;border-radius:50%;background:#2a2a52;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.side-foot .nm{font-size:12.5px;color:#e6e7f4;font-weight:500;line-height:1.3}
.side-foot .nm small{display:block;color:#7c80a8;font-size:11px;font-weight:400}

/* Main column */
.main{flex:1;margin-left:var(--shell-w);min-width:0;display:flex;flex-direction:column}

/* Top header — present on EVERY screen */
.header{
  height:var(--header-h);position:sticky;top:0;z-index:40;
  background:rgba(238,240,248,.82);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:16px;padding:0 28px;
}
.burger{display:none;background:#fff;border:1px solid var(--line-2);width:40px;height:40px;border-radius:11px;cursor:pointer;align-items:center;justify-content:center}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500;min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.5}
.header .spacer{flex:1}
.h-search{position:relative;display:flex;align-items:center}
.h-search input{
  background:#fff;border:1px solid var(--line-2);border-radius:var(--r-pill);
  height:42px;padding:0 16px 0 42px;width:230px;font-size:13px;color:var(--ink);transition:var(--t);
}
.h-search input:focus{outline:none;box-shadow:var(--ring);border-color:var(--teal);width:280px}
.h-search svg{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.icon-btn{
  width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line-2);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative;transition:var(--t);
}
.icon-btn:hover{color:var(--teal);border-color:var(--teal)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--neg);border:2px solid #fff}
.lang-switch{display:inline-flex;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.lang-switch button{border:none;background:transparent;height:34px;min-width:42px;padding:0 10px;border-radius:var(--r-pill);font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;transition:var(--t)}
.lang-switch button:hover{color:var(--ink)}
.lang-switch button.on{background:var(--teal-soft);color:var(--teal-ink)}

/* Page container */
.page{padding:28px;max-width:1240px;width:100%;margin:0 auto;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:600;margin:0 0 2px;letter-spacing:-.3px}
.page-head p{margin:0;color:var(--muted);font-size:13.5px}

/* ---------- Card (shared with Dashboard) ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(228,231,240,.7)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:15.5px;font-weight:600}
.card-head .sub{color:var(--muted);font-size:12px;margin-top:1px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 18px;border-radius:11px;border:1px solid transparent;
  font-weight:600;font-size:13.5px;cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 8px 18px rgba(26,138,78,.30)}
.btn-primary:hover{background:var(--teal-600);transform:translateY(-1px)}
.btn-ghost{background:#fff;border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-soft{background:var(--teal-soft);color:var(--teal-ink)}
.btn-soft:hover{background:#b6f2ef}
.btn-sm{height:36px;padding:0 14px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:var(--teal-soft);color:var(--teal-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600}
.badge .b-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.pos{background:var(--pos-bg);color:var(--pos-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.neg{background:var(--neg-bg);color:var(--neg-ink)}
.badge.info{background:var(--info-bg);color:var(--info-ink)}
.badge.muted{background:#eef0f6;color:var(--muted)}

/* Filter pills (segmented) */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;height:34px;padding:0 16px;border-radius:var(--r-pill);font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;transition:var(--t)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--teal-soft);color:var(--teal-ink)}

/* Inputs */
.field{position:relative}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input,select.input{
  width:100%;height:44px;border:1px solid var(--line-2);border-radius:11px;padding:0 14px;
  font-size:13.5px;color:var(--ink);background:#fff;transition:var(--t);
}
.input:focus,select.input:focus{outline:none;border-color:var(--teal);box-shadow:var(--ring)}
.search-wrap{position:relative}
.search-wrap input{padding-left:42px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Money — right aligned + tabular */
.money{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.money.pos{color:var(--pos-ink)}
.money.neg{color:var(--neg-ink)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
table.tbl tbody tr{transition:background var(--t)}
table.tbl tbody tr:hover{background:#f9fafd}
table.tbl tbody tr:last-child td{border-bottom:none}

/* ---------- News list ---------- */
.news-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.news-card{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform var(--t),box-shadow var(--t)}
.news-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.news-card:focus-visible{outline:none;box-shadow:var(--ring)}
.news-card .thumb{aspect-ratio:16/9;background:#dfe3f2;position:relative;overflow:hidden;border-radius:12px 12px 0 0}
.news-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.news-card:hover .thumb img{transform:scale(1.05)}
.news-card .thumb .cat{position:absolute;top:12px;left:12px}
.news-card .body{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
.news-card .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:500}
.news-card .meta svg{flex:none}
.news-card h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.2px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card .foot{margin-top:auto;padding-top:4px;display:flex;align-items:center;color:var(--teal-ink);font-weight:600;font-size:12.5px;gap:6px;transition:gap var(--t)}
.news-card:hover .foot{gap:10px}

/* Pager */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:30px}
.pager button{min-width:40px;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-weight:600;font-size:13.5px;cursor:pointer;transition:var(--t)}
.pager button:hover:not(:disabled){border-color:var(--teal);color:var(--teal-ink)}
.pager button.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 14px rgba(26,138,78,.3)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .dots{color:var(--muted);padding:0 4px}

/* ---------- News detail — single readable column ---------- */
.article{max-width:760px;margin:0 auto}
.article-head{margin-bottom:20px}
.article-head .meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:14px;flex-wrap:wrap}
.article-head h1{font-size:32px;font-weight:600;line-height:1.18;letter-spacing:-.6px;margin:0;color:var(--ink)}
.detail-hero{aspect-ratio:16/8;border-radius:var(--r);overflow:hidden;margin-bottom:26px;background:#dfe3f2}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.prose{font-size:16px;line-height:1.8;color:var(--ink-2)}
.prose h3{color:var(--ink);font-size:19px;margin:28px 0 10px}
.prose p{margin:0 0 18px}
.prose ul{margin:0 0 18px;padding-left:20px}
.prose li{margin-bottom:8px}
.prose strong{color:var(--ink)}
.attach{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line-2);border-radius:12px;margin-bottom:10px;transition:var(--t);cursor:pointer}
.attach:hover{border-color:var(--teal);background:#f9fefe}
.attach .ico{width:40px;height:40px;border-radius:10px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;flex:none}
.attach .nm{font-weight:600;font-size:13px;color:var(--ink)}
.attach .sz{font-size:11.5px;color:var(--muted)}
.related-wrap{max-width:1100px;margin:40px auto 0}
.related-wrap .rl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.related-wrap h3{margin:0;font-size:18px;font-weight:600}

/* ---------- Apartments ---------- */
.proj-group{margin-bottom:30px}
.proj-head{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.proj-head .pj-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.proj-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px}
.proj-head .count{color:var(--muted);font-size:12.5px;font-weight:500;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px 11px}
.apt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.apt-card{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;border:1px solid rgba(228,231,240,.7);
  transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
.apt-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--teal)}
.apt-card:focus-visible{outline:none;box-shadow:var(--ring)}
.apt-card .top{display:flex;align-items:flex-start;gap:14px;padding:18px 18px 14px}
.apt-card .bicon{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 14px rgba(20,24,60,.12)}
.apt-card .hd{flex:1;min-width:0}
.apt-card .code{font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--ink);font-variant-numeric:tabular-nums;word-break:break-word}
.apt-card .role{margin-top:7px}
.apt-card .metarow{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.apt-card .metarow .m{flex:1;padding:12px 18px}
.apt-card .metarow .m+.m{border-left:1px solid var(--line)}
.apt-card .metarow .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.apt-card .metarow .v{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.apt-card .status{display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:13px}
.apt-card .status .sdot{width:9px;height:9px;border-radius:50%;flex:none}
.apt-card .status .slab{color:var(--muted);font-weight:500}
.apt-card .status .sval{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.apt-card .hint{margin-top:auto;display:flex;align-items:center;gap:6px;padding:13px 18px;color:var(--muted);font-weight:600;font-size:12px;transition:color var(--t)}
.apt-card .hint .arr{display:inline-flex;transition:transform var(--t)}
.apt-card:hover .hint{color:var(--teal-ink)}
.apt-card:hover .hint .arr{transform:translateX(4px)}

/* Summary strip */
.apt-summary{display:flex;flex-wrap:wrap;gap:30px;align-items:center;padding:20px 24px;margin-bottom:26px}
.apt-summary .item{display:flex;align-items:center;gap:14px}
.apt-summary .item .si{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.apt-summary .item .lab{color:var(--muted);font-size:12.5px;font-weight:500}
.apt-summary .item .num{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.apt-summary .divider{width:1px;align-self:stretch;background:var(--line-2)}

/* ---------- Apartment detail: overview block ---------- */
.bicon-lg{width:74px;height:74px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(20,24,60,.14)}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.ov-head h3{margin:0;font-size:15.5px;font-weight:600}
.ov-body{padding:22px;display:flex;gap:24px;align-items:flex-start}
.ov-body .meta{flex:1;min-width:0}
.ov-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ov-meta .cell{background:#fff;padding:13px 15px;min-width:0}
.ov-meta .k{color:var(--muted);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.ov-meta .v{font-weight:600;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.qr-corner{flex:none;width:128px;text-align:center}
.qr-corner .qr{width:108px;height:108px;border:1px solid var(--line-2);border-radius:12px;padding:9px;background:#fff;cursor:pointer;transition:var(--t);margin:0 auto}
.qr-corner .qr:hover{border-color:var(--teal);box-shadow:var(--ring)}
.qr-corner .qr svg{width:100%;height:100%;display:block}
.qr-corner .ql{font-size:11px;color:var(--muted);margin-top:8px}
.copywrap{display:inline-flex;align-items:center;gap:8px}
.copy-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line-2);background:#fff;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center;flex:none;transition:var(--t)}
.copy-btn:hover{border-color:var(--teal);color:var(--teal-ink)}
.copy-btn:focus-visible{outline:none;box-shadow:var(--ring)}
.copy-btn.ok{color:var(--pos-ink);border-color:var(--pos-bg);background:var(--pos-bg)}

/* ---------- Service accordion cards ---------- */
.svc{margin-bottom:14px;overflow:hidden}
.svc-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;width:100%;background:none;border:none;text-align:left;font-family:inherit}
.svc-head:focus-visible{outline:none;box-shadow:var(--ring)}
.svc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.svc-tt{min-width:0}
.svc-name{font-weight:600;font-size:15px;color:var(--ink)}
.svc-sub{font-size:12px;color:var(--muted);margin-top:1px}
.svc-metric{margin-left:auto;text-align:right;padding-left:12px}
.svc-metric .m-lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.svc-metric .m-val{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;margin-top:1px}
.svc-actions{display:flex;align-items:center;gap:10px;margin-left:auto;padding-left:12px}
.svc .chev{transition:transform var(--t);color:var(--muted);flex:none}
.svc.open .chev{transform:rotate(180deg)}
.svc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
.svc.open .svc-body{grid-template-rows:1fr}
.svc-body>.inner{overflow:hidden;min-height:0}
.svc-inner{padding:2px 18px 18px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.svc-grid .cell{background:#fff;padding:14px 16px}
.svc-grid .k{color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:600}
.svc-grid .v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.svc-2{grid-template-columns:repeat(2,1fr)}
.svc-cta{display:flex;gap:10px;flex-wrap:wrap}
.section-label{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:26px 0 14px}

/* ---------- Modal size variants + generic ---------- */
.modal.md{max-width:560px}
.modal.lg{max-width:720px}
.modal.xl{max-width:940px}
.modal-foot.split{justify-content:space-between}

/* date pickers row */
.date-row{display:flex;gap:12px;flex-wrap:wrap}
.date-row .field{flex:1;min-width:140px}

/* ---------- Doors calendar ---------- */
.cal-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.cal-nav .mlabel{font-weight:600;font-size:14px;min-width:130px;text-align:center}
.cal-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:#fff;cursor:pointer;color:var(--ink-2)}
.cal-nav button:hover{border-color:var(--teal);color:var(--teal)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding-bottom:4px}
.cal-day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.cal-day.empty{border:none;background:transparent}
.cal-day .dnum{font-size:12px;font-weight:600;color:var(--ink-2)}
.cal-day .cnt{font-size:11px;font-weight:700;align-self:flex-start;padding:2px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal-ink)}
.cal-day .cnt.zero{background:#eef0f6;color:var(--muted)}
.cal-day.hi{border-color:var(--teal);background:#f6fefe}
.cal-list{display:none}
.cal-list .row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px}
.cal-summary{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.cal-summary b{color:var(--ink)}

/* ---------- Pay checkout page ---------- */
.pay-page{max-width:620px;margin:0 auto}

/* ---------- Internet & TV subscription summary ---------- */
.sub-panel{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.sub-panel .cell{background:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.sub-panel .cell.ringc{align-items:center;flex-direction:row;gap:14px}
.sub-panel .k{color:var(--muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;margin-bottom:5px}
.sub-panel .v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .rt b{font-size:18px;font-weight:700}
.ring .rt small{font-size:8.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.sub-actions{display:flex;gap:10px;flex-wrap:wrap}

/* plan grid (change package) */
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.plan{border:1.5px solid var(--line-2);border-radius:16px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.plan:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.plan.current{border-color:var(--teal);background:#f4fcf7;box-shadow:0 0 0 1px var(--teal) inset}
.plan .cur-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap}
.plan .pname{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:10px;white-space:nowrap}
.plan .price{display:inline-flex;align-items:flex-start;justify-content:center;gap:3px;line-height:1}
.plan .price .amt{font-size:30px;font-weight:700;letter-spacing:-1px;color:var(--ink);font-variant-numeric:tabular-nums}
.plan .price .cur{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.plan .per{font-size:11px;color:var(--muted);margin-top:4px}
.plan .p-div{width:36px;height:2px;background:var(--line-2);border-radius:2px;margin:13px 0}
.plan .spec{width:100%}
.plan .spec+.spec{margin-top:9px}
.plan .spec .lab{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.plan .spec .val{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px;white-space:nowrap}
.plan-info{display:flex;flex-direction:column;align-items:center;width:100%}
.plan-meta{display:none}
.plan-cta{width:100%;margin-top:15px}
.plan .btn{width:100%}
.plan .btn.is-active{background:var(--teal-soft);color:var(--teal-ink);box-shadow:none;pointer-events:none}

/* boost cards */
.boost{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line-2);border-radius:12px;padding:14px 16px;cursor:pointer;transition:var(--t);margin-bottom:10px}
.boost:hover{border-color:var(--teal)}
.boost.sel{border-color:var(--teal);background:#f3fdfc}
.boost:focus-visible{outline:none;box-shadow:var(--ring)}
.boost .bi{width:42px;height:42px;border-radius:11px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;flex:none}
.boost .bt{flex:1;min-width:0}
.boost .bname{font-weight:600;font-size:14px;color:var(--ink)}
.boost .bsub{font-size:12px;color:var(--muted);margin-top:1px}
.boost .bprice{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.boost .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;color:#fff}
.boost.sel .check{background:var(--teal);border-color:var(--teal)}

/* warning box (pause) */
.warn-box{display:flex;gap:16px;padding:16px;background:var(--warn-bg);border:1px solid #ffe1a8;border-radius:12px}
.warn-box .wi{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--warn-ink);display:grid;place-items:center;flex:none}
.warn-box h4{margin:0 0 4px;font-size:14px;color:var(--ink)}
.warn-box p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.btn-warn{background:var(--warn);color:#fff;box-shadow:0 8px 18px rgba(255,168,0,.28)}
.btn-warn:hover{background:#e89800}

.diff-up{color:var(--pos-ink);font-weight:600}
.diff-down{color:var(--neg-ink);font-weight:600}
.diff-same{color:var(--muted);font-weight:600}
.cmp-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cmp-row:last-child{border-bottom:none}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.stat{padding:20px}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.stat .lab{color:var(--muted);font-size:12.5px;font-weight:500}
.stat .num{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{
  border:none;background:none;padding:14px 18px;font-weight:600;font-size:13.5px;color:var(--muted);
  cursor:pointer;position:relative;white-space:nowrap;transition:var(--t);
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--teal-ink)}
.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--teal)}

/* Overview detail */
.bal-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:0;overflow:hidden}
.bal-hero .l{padding:28px;background:linear-gradient(135deg,var(--sidebar),var(--sidebar-2));color:#fff}
.bal-hero .l .lab{color:#9b9fce;font-size:13px;font-weight:500}
.bal-hero .l .big{font-size:38px;font-weight:700;letter-spacing:-1px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bal-hero .l .note{color:#c9cce8;font-size:12.5px}
.bal-hero .r{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.info-grid .cell{background:#fff;padding:16px 18px}
.info-grid .cell .k{color:var(--muted);font-size:12px;margin-bottom:4px}
.info-grid .cell .v{font-weight:600;font-size:14px}

/* ---------- Skeleton ---------- */
.sk{background:linear-gradient(90deg,#eef0f6 25%,#e4e7f0 37%,#eef0f6 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-line{height:12px;margin-bottom:9px}
.sk-thumb{height:170px;border-radius:0}
.sk-pill{height:28px;width:80px;border-radius:999px}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(17,20,45,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity var(--t)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);transform:translateY(14px) scale(.98);transition:transform var(--t);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:17px;font-weight:600}
.modal-x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:var(--t)}
.modal-x:hover{background:var(--neg-bg);color:var(--neg-ink);border-color:var(--neg-bg)}
.modal-x:focus-visible{outline:none;box-shadow:var(--ring)}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfe}

/* Payment steps */
.steps{display:flex;align-items:center;gap:0;margin-bottom:22px}
.steps .stp{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.steps .stp .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#eef0f6;color:var(--muted);font-size:12px}
.steps .stp.on .n{background:var(--teal);color:#fff}
.steps .stp.done .n{background:var(--teal-soft);color:var(--teal-ink)}
.steps .ln{flex:1;height:2px;background:var(--line-2);margin:0 8px}
.pay-method{display:flex;align-items:center;gap:13px;padding:14px;border:1.5px solid var(--line-2);border-radius:12px;cursor:pointer;margin-bottom:10px;transition:var(--t)}
.pay-method:hover{border-color:var(--teal)}
.pay-method.sel{border-color:var(--teal);background:#f6fefe}
.pay-method .mi{width:42px;height:30px;border-radius:6px;background:#eef0f6;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:var(--ink-2)}
.pay-method .rad{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.pay-method.sel .rad{border-color:var(--teal)}
.pay-method.sel .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal)}
.success-ring{width:74px;height:74px;border-radius:50%;background:var(--teal-soft);display:grid;place-items:center;margin:0 auto 16px;color:var(--teal-ink);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-box{text-align:center;padding:26px 10px}
.gen-box .sk{margin:0 auto}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:16px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;margin:0 auto 14px}

/* ============================================================
   SUPPORT — two-pane (desktop) / single-column (mobile)
   ============================================================ */
.sup-wrap{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:stretch;height:calc(100vh - 214px);min-height:540px}
.sup-list,.sup-detail{display:flex;flex-direction:column;overflow:hidden;padding:0}
/* ----- list panel ----- */
.sup-list-top{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.sup-list-top .row1{display:flex;gap:10px;align-items:center}
.sup-list-top .search-wrap{flex:1}
.sup-list-top .search-wrap input{height:40px}
.sup-tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.sup-tabs::-webkit-scrollbar{display:none}
.sup-tabs button{border:none;background:none;padding:7px 12px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:9px;white-space:nowrap;transition:var(--t)}
.sup-tabs button:hover{color:var(--ink)}
.sup-tabs button.on{background:var(--teal-soft);color:var(--teal-ink)}
.sup-items{overflow-y:auto;flex:1;padding:8px}
.sup-item{display:flex;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:var(--t);border:1px solid transparent;align-items:flex-start;margin-bottom:2px}
.sup-item:hover{background:#f9fafd}
.sup-item.on{background:#f4fcf7;border-color:var(--teal)}
.sup-item:focus-visible{outline:none;box-shadow:var(--ring)}
.sup-item .si-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.sup-item .si-ic svg{width:20px;height:20px}
.sup-item .si-main{flex:1;min-width:0}
.sup-item .si-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sup-item .si-title{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-item .badge{flex:none}
.sup-item .si-prev{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.sup-item .si-meta{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.si-apt{display:inline-flex;align-items:center;gap:4px;background:var(--teal-soft);color:var(--teal-ink);border-radius:999px;padding:2px 9px;font-weight:600;font-size:10.5px}
.si-apt svg{width:11px;height:11px}
/* ----- detail header / body ----- */
.sup-dhead{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.sup-dhead .dh-main{flex:1;min-width:0}
.sup-dhead h3{margin:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-dhead .dh-sub{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sup-dhead .si-ic svg{width:20px;height:20px}
.sup-dbody{overflow-y:auto;flex:1;padding:22px}
.sup-back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none;transition:var(--t)}
.sup-back:hover{border-color:var(--teal);color:var(--teal)}
.sup-back:focus-visible{outline:none;box-shadow:var(--ring)}
.sup-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;justify-content:space-between;background:#fafbfe}
/* ----- empty detail ----- */
.sup-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);padding:40px}
/* ----- create form ----- */
.sup-form{max-width:660px}
.topic-picker{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;border:1.5px solid var(--line-2);border-radius:12px;cursor:pointer;transition:var(--t);width:100%;background:#fff;text-align:left;font-family:inherit}
.topic-picker:hover{border-color:var(--teal)}
.topic-picker.chosen{border-color:var(--teal);background:#f6fefe}
.topic-picker .tp-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:#eef0f6;color:var(--muted)}
.topic-picker .tp-ic svg{width:19px;height:19px}
.topic-picker .tp-main{flex:1;min-width:0}
.topic-picker .tp-t{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-picker .tp-d{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-picker .tp-act{color:var(--teal-ink);font-weight:600;font-size:12.5px;flex:none}
.req{color:var(--neg-ink);font-weight:700}
/* topic modal grid */
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:5px;padding:16px;border:1.5px solid var(--line-2);border-radius:14px;background:#fff;cursor:pointer;transition:var(--t);font-family:inherit}
.topic-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow)}
.topic-card.sel{border-color:var(--teal);background:#f6fefe;box-shadow:0 0 0 1px var(--teal) inset}
.topic-card .tc-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:4px}
.topic-card .tc-ic svg{width:24px;height:24px}
.topic-card .tc-t{font-weight:600;font-size:14px;color:var(--ink)}
.topic-card .tc-d{font-size:12px;color:var(--muted);line-height:1.4}
/* apartment combobox */
.combo{position:relative}
.combo-btn{display:flex;align-items:center;gap:10px;width:100%;height:52px;border:1.5px solid var(--line-2);border-radius:12px;padding:0 14px;background:#fff;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;transition:var(--t)}
.combo-btn:hover{border-color:var(--teal)}
.combo-btn .cb-chev{margin-left:auto;color:var(--muted);transition:transform var(--t);flex:none}
.combo.open .combo-btn{border-color:var(--teal);box-shadow:var(--ring)}
.combo.open .cb-chev{transform:rotate(180deg)}
.combo-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;overflow:hidden;display:none}
.combo.open .combo-panel{display:block}
.combo-search{padding:10px;border-bottom:1px solid var(--line)}
.combo-search input{height:38px}
.combo-opts{max-height:240px;overflow-y:auto;padding:6px}
.combo-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:var(--t)}
.combo-opt:hover{background:#f4fcf7}
.combo-opt.sel{background:var(--teal-soft)}
.combo-opt .co-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.combo-opt .co-ic svg{width:18px;height:18px}
.combo-opt .co-t{font-weight:600;font-size:13px;color:var(--ink)}

const routes={};
function route(name,fn){routes[name]=fn;}
function go(hash){ if(location.hash===hash){render();} else location.hash=hash; }
window.addEventListener('hashchange',render);

function setActive(nav){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===nav));}
function crumbs(items){
  $('#crumbs').innerHTML=items.map((it,i)=>{
    const last=i===items.length-1;
    const sep=i>0?`<span class="sep">›</span>`:'';
    return sep+(last?`<b>${it.label}</b>`:`<a href="${it.href}">${it.label}</a>`);
  }).join('');
}

function render(){
  const h=location.hash.replace('#','')||'/news';
  const [path,arg]=h.split('/').filter(Boolean).length?h.split('/').filter(Boolean):['news'];
  const parts=h.split('/').filter(Boolean);
  const key=parts[0]||'news';
  // close mobile sidebar + any open modal on nav
  $('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');
  modalLocked=false; $('#modalOverlay').classList.remove('open'); document.body.style.overflow='';
  if(key==='news' && parts[1]) return routes.newsDetail(parts[1]);
  if(key==='pay' && parts[1]) return routes.payPage(parts[1]);
  if(key==='apartments' && parts[1]) return routes.aptDetail(parts[1]);
  if(key==='support') return routes.support(parts.slice(1));
  (routes[key]||routes.news)();
  view.scrollTo?.(0,0); window.scrollTo(0,0);
}

function newsFiltered(){
  return NEWS
    .filter(n=>(newsFilter==='All'||n.cat===newsFilter) && (n.title+n.excerpt).toLowerCase().includes(newsQuery.toLowerCase()))
    .sort((a,b)=> newsSort==='new' ? b.ts-a.ts : a.ts-b.ts);
}
// reusable card component — used by list AND article "Related news"
function newsCardHtml(n){
  return `<article class="card news-card" tabindex="0" role="link" aria-label="${n.title}" onclick="go('#/news/${n.id}')" onkeydown="if(event.key==='Enter')go('#/news/${n.id}')">
    <div class="thumb"><img src="${newsImg(n,640,360)}" alt="" loading="lazy" onerror="imgFallback(this,${n.seed},640,360)"><div class="cat"><span class="chip">${n.cat}</span></div></div>
    <div class="body">
      <div class="meta">${I.cal} <span>${n.date}</span></div>
      <h3>${n.title}</h3>
      <p>${n.excerpt}</p>
      <div class="foot">Read more ${I.arrow}</div>
    </div></article>`;
}
function paintNews(){
  const list=$('#newsList'); if(!list)return;
  const items=newsFiltered();
  if(!items.length){ list.innerHTML=`<div class="card"><div class="empty"><div class="ei">${I.empty}</div><h3 style="margin:0 0 4px;color:var(--ink)">No news yet</h3><p style="margin:0">Try a different category or search term.</p></div></div>`; return; }
  const pages=Math.max(1,Math.ceil(items.length/NEWS_PER_PAGE));
  if(newsPage>pages)newsPage=pages;
  const start=(newsPage-1)*NEWS_PER_PAGE;
  const pageItems=items.slice(start,start+NEWS_PER_PAGE);
  let html=`<div class="news-grid">${pageItems.map(newsCardHtml).join('')}</div>`;
  html+=pagerHtml(pages,newsPage);
  list.innerHTML=html;
}
function pagerHtml(pages,cur){
  if(pages<=1)return '';
  let btns='';
  const add=(p)=>btns+=`<button class="${p===cur?'on':''}" aria-label="Page ${p}" ${p===cur?'aria-current="page"':''} onclick="newsPage=${p};paintNews();document.querySelector('.page').scrollIntoView({behavior:'smooth'})">${p}</button>`;
  const dots=()=>btns+=`<span class="dots">…</span>`;
  btns+=`<button ${cur===1?'disabled':''} aria-label="Previous page" onclick="newsPage--;paintNews()">‹</button>`;
  const win=[1];
  for(let p=cur-1;p<=cur+1;p++) if(p>1&&p<pages) win.push(p);
  if(pages>1) win.push(pages);
  const uniq=[...new Set(win)].sort((a,b)=>a-b);
  let prev=0;
  uniq.forEach(p=>{ if(p-prev>1) dots(); add(p); prev=p; });
  btns+=`<button ${cur===pages?'disabled':''} aria-label="Next page" onclick="newsPage++;paintNews()">›</button>`;
  return `<nav class="pager" aria-label="Pagination">${btns}</nav>`;
}

function paintApts(){
  const body=$('#aptBody'); if(!body)return;

  const items=APTS.filter(a=>aptRole==='All'||a.role===aptRole);
  if(!items.length){ body.innerHTML=`<div class="card"><div class="empty"><div class="ei">${I.home}</div><h3 style="margin:0 0 4px;color:var(--ink)">No apartments with this role</h3><p style="margin:0">Try a different role filter.</p></div></div>`; return; }
  const groups={}; items.forEach(a=>{(groups[a.project]=groups[a.project]||[]).push(a);});

}

function progressRing(left,total){
  const r=30,c=2*Math.PI*r,pct=Math.max(0,Math.min(1,left/total)),off=c*(1-pct);

      <circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="rt"><b>${left}</b><small>days left</small></div></div>`;
}

      </div>

      ${neg?`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--neg-bg);background:var(--neg-bg);border-radius:10px;margin-bottom:14px"><span style="font-weight:600;color:var(--neg-ink)">Outstanding balance</span><span class="money neg">${fmt(-s.balance)}</span></div>`:''}

        ${neg?`<button class="btn btn-primary btn-sm" onclick="go('#/pay/${a.id}')">Pay ${fmt(-s.balance)}</button>`:''}
      </div>`;
  }
  const sub=active?`${pl?pl.name:''} · ${s.provider}`:(paused?'Paused':'No active plan');

   MODAL PRIMITIVES + feature modals — a11y (ESC, click-out, focus trap, ARIA)

let lastFocused=null, modalLocked=false;
const overlay=$('#modalOverlay');
function openSheet(html,size=''){ $('#modalBox').className='modal '+size; $('#modalBox').innerHTML=html; lastFocused=document.activeElement; overlay.classList.add('open'); document.body.style.overflow='hidden'; trapFocus(); }
function closeModal(){ if(modalLocked)return; overlay.classList.remove('open'); document.body.style.overflow=''; lastFocused?.focus?.(); }
overlay.addEventListener('mousedown',e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });
function trapFocus(){
  const f=overlay.querySelectorAll('button:not([disabled]),input,select,[tabindex="0"],a[href]');
  if(!f.length)return; const first=f[0],last=f[f.length-1];
  setTimeout(()=>first.focus?.(),30);
  overlay.onkeydown=e=>{ if(e.key!=='Tab')return;
    if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
  };
}

let supFilter='all', supQuery='', newTicket=null, supNav=0;

route('support',async (sub=[])=>{
  setActive('support');
  let mode='list', tid=null;
  if(sub[0]==='new'){ mode='create'; if(!newTicket) newTicket={topic:null,apt:null,text:'',files:[],aptOpen:false}; }
  else if(sub[0]==='t' && sub[1]){ mode='chat'; tid=parseInt(sub[1],10); }
  crumbs(mode==='create'?[{label:'Home',href:'#/news'},{label:'Support',href:'#/support'},{label:'New ticket'}]
       : mode==='chat' ?[{label:'Home',href:'#/news'},{label:'Support',href:'#/support'},{label:'#'+tid}]
       :                 [{label:'Home',href:'#/news'},{label:'Support'}]);
  if(mode==='create'){ renderSupport('create',null,false); return; }
  const token=++supNav;                 // guard: ignore if user navigates away mid-load
  renderSupport(mode,tid,true);          // show skeletons
  await sleep(mode==='chat'?650:800);
  if(token!==supNav) return;
  renderSupport(mode,tid,false);         // real content
});

function renderSupport(mode,tid,loading){
  const listLoading = loading && mode==='list';   // list skeleton only on the list screen
  let detail;
  if(mode==='create') detail=supCreateHtml();
  else if(mode==='chat'){ const t=TICKETS.find(x=>x.id===tid); if(t){detail=supChatHtml(t,loading);} else {mode='list';detail=supEmptyHtml();} }
  else detail=supEmptyHtml();
  view.innerHTML=`<div class="page sup-page">
    <div class="page-head"><div><h1>Support</h1><p>Get help from the ORBI team — track your tickets and chat with support.</p></div></div>
    <div class="sup-wrap" data-mode="${mode}">
      <aside class="sup-list card">${supListHtml(listLoading)}</aside>
      <section class="sup-detail card">${detail}</section>
    </div>
  </div>`;
  wireSupport(mode,tid);
  if(LANG!=='en') translateAll();
}

    <div class="sk" style="width:40px;height:40px;border-radius:11px;flex:none"></div>

      <div class="sk sk-line" style="width:54%;height:13px;margin:2px 0 0"></div>

      <div class="sk sk-line" style="width:38%;height:10px;margin:9px 0 0"></div>
    </div>
  </div>`;

function skChatBody(){
  const b=[[ 'them','58%',52],['me','44%',36],['them','66%',60],['me','38%',36]];
  return `<div class="chat-day"><span class="sk" style="display:inline-block;width:74px;height:18px;border-radius:999px"></span></div>`

function supItemsHtml(){
  let items=TICKETS.filter(t=>supFilter==='all'||t.status===supFilter);
  const q=supQuery.trim().toLowerCase();
  if(q) items=items.filter(t=>{const tp=topicById(t.topic);return (tp&&tp.label.toLowerCase().includes(q))||t.preview.toLowerCase().includes(q)||String(t.id).includes(q);});
  if(!items.length) return `<div class="empty" style="padding:44px 16px"><div class="ei">${I.chat}</div><h3 style="margin:0 0 4px;color:var(--ink);font-size:14px">No tickets found</h3><p style="margin:0;font-size:12.5px">Try a different filter or search term.</p></div>`;
  const cur=(location.hash.split('/')[2]==='t')?parseInt(location.hash.split('/')[3],10):null;
  return items.map(t=>supItemHtml(t,cur)).join('');
}

function submitTicket(){
  if(!newTicket.topic||!newTicket.text.trim())return;
  const b=$('#supSubmit'); if(b){ b.disabled=true; b.innerHTML=`<span class="spin"></span> Creating…`; }
  setTimeout(()=>{
    const id=++TICKET_SEQ, now=new Date();
    const dd=String(now.getDate()).padStart(2,'0'),mm=String(now.getMonth()+1).padStart(2,'0'),yy=now.getFullYear();
    const hh=String(now.getHours()).padStart(2,'0'),mi=String(now.getMinutes()).padStart(2,'0');
    const t={id,topic:newTicket.topic,apt:newTicket.apt,status:'active',created:`${yy}-${mm}-${dd} ${hh}:${mi}`,
      preview:newTicket.text.trim().slice(0,90),
      msgs:[{me:true,date:`${dd}.${mm}.${yy}`,time:`${hh}:${mi}`,text:newTicket.text.trim(),files:newTicket.files.slice()}]};
    TICKETS.unshift(t); newTicket=null; toast('Ticket #'+id+' created');
    go('#/support/t/'+id);
    setTimeout(()=>{ const tk=TICKETS.find(x=>x.id===id); if(tk){ tk.msgs.push({me:false,who:'ORBI Support',date:`${dd}.${mm}.${yy}`,time:`${hh}:${mi}`,text:'Thanks for reaching out! Your ticket has been received. Our team will reply shortly.'}); if(location.hash==='#/support/t/'+id){ renderSupport('chat',id); const c=$('#chatBody'); if(c)c.scrollTop=c.scrollHeight; } } },1400);
  },900);
}

/* ----- chat thread ----- */
function supChatHtml(t,loading){
  const tp=topicById(t.topic), st=TSTATUS[t.status];
  const apt=t.apt?APTS.find(a=>a.id===t.apt):null;
  let body='', lastDate=null;
  if(loading){ body=skChatBody(); }
  else t.msgs.forEach(m=>{
    if(m.date!==lastDate){ body+=`<div class="chat-day"><span>${m.date}</span></div>`; lastDate=m.date; }
    const files=(m.files&&m.files.length)?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${m.files.map(f=>`<span class="file-chip" style="background:#fff">${I.clip}${escHtml(f)}</span>`).join('')}</div>`:'';
    body+=`<div class="msg ${m.me?'me':'them'}"><div class="bubble">${m.me?'':`<div class="who">${escHtml(m.who||'ORBI Support')}</div>`}${escHtml(m.text)}${files}<div class="time">${m.time}</div></div></div>`;
  });
  const composer=loading ? ''
    : (t.status!=='active')
    ? `<div class="chat-closed">This ticket is ${st.label.toLowerCase()}. Start a new ticket if you need further help.</div>`
    : `<div class="chat-composer">
        <textarea class="input" id="chatText" placeholder="Type a message" rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg(${t.id})}"></textarea>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;margin:0" title="Attach">${I.clip}<input type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none"></label>
        <button class="btn btn-primary" aria-label="Send" onclick="sendMsg(${t.id})">${I.send}</button>
      </div>`;
  return `<div class="sup-dhead">
      <button class="sup-back" aria-label="Back" onclick="go('#/support')">${I.back}</button>
      <div class="si-ic" style="background:${tp.tintBg};color:${tp.tintCol};width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none">${tp.icon}</div>
      <div class="dh-main"><h3>${tp.label} <span style="color:var(--muted);font-weight:500">#${t.id}</span></h3>
        <div class="dh-sub"><span class="badge ${st.cls}"><span class="b-dot"></span>${st.label}</span>${apt?`<span class="si-apt">${I.pin}${apt.code}</span>`:`<span>General</span>`}<span>${t.created}</span></div>
      </div>
    </div>
    <div class="sup-dbody" id="chatBody">${body}</div>
    ${composer}`;
}
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function sendMsg(id){
  const el=$('#chatText'); if(!el)return; const v=el.value.trim(); if(!v)return;
  const t=TICKETS.find(x=>x.id===id); if(!t)return;
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,'0'),mm=String(now.getMonth()+1).padStart(2,'0'),yy=now.getFullYear();
  const hh=String(now.getHours()).padStart(2,'0'),mi=String(now.getMinutes()).padStart(2,'0');
  t.msgs.push({me:true,date:`${dd}.${mm}.${yy}`,time:`${hh}:${mi}`,text:v}); t.preview=v.slice(0,90);
  renderSupport('chat',id); let c=$('#chatBody'); if(c)c.scrollTop=c.scrollHeight;
  setTimeout(()=>{ const tk=TICKETS.find(x=>x.id===id); if(tk&&location.hash==='#/support/t/'+id){ tk.msgs.push({me:false,who:'ORBI Support',date:`${dd}.${mm}.${yy}`,time:`${hh}:${mi}`,text:'Thank you — a support agent will follow up on this shortly.'}); renderSupport('chat',id); const cc=$('#chatBody'); if(cc)cc.scrollTop=cc.scrollHeight; } },1300);
}

function wireSupport(mode,tid){
  const s=$('#supSearch'); if(s) s.addEventListener('input',e=>{ supQuery=e.target.value; const it=$('#supItems'); if(it)it.innerHTML=supItemsHtml(); });
  const tabs=$('.sup-tabs'); if(tabs) tabs.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; supFilter=b.dataset.f; document.querySelectorAll('.sup-tabs button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on);}); const it=$('#supItems'); if(it)it.innerHTML=supItemsHtml(); });
  const nb=$('#supNew'); if(nb) nb.addEventListener('click',startNewTicket);
  if(mode==='chat'){ const cb=$('#chatBody'); if(cb)cb.scrollTop=cb.scrollHeight; }
}

let toastT;
function toast(msg){ const t=$('#toast'); t.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.5"><path d="M5 13l4 4 10-11"/></svg> ${msg}`; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
// simulate generating a document before download
function genDownload(btn,working,done,ms){ if(btn.dataset.busy)return; btn.dataset.busy='1'; const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span> ${working}`; setTimeout(()=>{ btn.disabled=false; btn.dataset.busy=''; btn.innerHTML=orig; toast(done); }, ms||1300); }
// copy text to clipboard with a brief check-mark confirmation on the button
function copyText(ev,text){ ev.stopPropagation(); const btn=ev.currentTarget;
  const done=()=>{ const o=btn.innerHTML; btn.classList.add('ok'); btn.innerHTML=`${I.check.replace('width="34" height="34"','width="13" height="13"')}`; toast('Copied: '+text); setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=o;},1400); };
  try{ navigator.clipboard.writeText(text).then(done,done); }catch(e){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();done(); }
}

 ka:[[/^(\d+)\s*min read$/i,(m,n)=>`${n} წთ კითხვა`],[/^(\d+)\s*units?$/i,(m,n)=>`${n} ერთეული`],[/^(\d+)\s*unit$/i,(m,n)=>`${n} ერთეული`],[/^(\d+)\s*channels$/i,(m,n)=>`${n} არხი`],[/^until\s+(.+)$/i,(m,r)=>`ვადა: ${r}`],[/^Active boost:\s*(.+)$/i,(m,r)=>`აქტიური ბუსტი: ${r}`],[/^Pay\s+(₾[\d.,]+)$/i,(m,r)=>`გადახდა ${r}`],[/^Pay balance\s+(₾[\d.,]+)$/i,(m,r)=>`ბალანსის გადახდა ${r}`]],

};
function trPhrase(key){ const d=TR[LANG]; if(!d)return undefined; if(d[key]!==undefined)return d[key]; for(const [re,fn] of (PAT[LANG]||[])){ if(re.test(key)) return key.replace(re,fn); } return undefined; }
const ORIG=new WeakMap();
function translateRoot(root){ if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); const nodes=[]; let n; while(n=w.nextNode())nodes.push(n);
  nodes.forEach(node=>{ let eng=ORIG.get(node); if(eng===undefined){eng=node.nodeValue;ORIG.set(node,eng);} const key=eng.trim(); if(!key||!/[A-Za-z]/.test(key))return;
    const lead=eng.match(/^\s*/)[0],trail=eng.match(/\s*$/)[0];
    if(LANG==='en'){ if(node.nodeValue!==eng)node.nodeValue=eng; return; }
    const out=trPhrase(key); if(out!==undefined&&out!==key) node.nodeValue=lead+out+trail; else if(node.nodeValue!==eng) node.nodeValue=eng;
  });
  root.querySelectorAll&&root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(i=>{ if(i.dataset.ph0===undefined)i.dataset.ph0=i.getAttribute('placeholder')||''; const eng=i.dataset.ph0; i.setAttribute('placeholder', LANG==='en'?eng:(trPhrase(eng.trim())||eng)); });
}
function translateAll(){ translateRoot(document.querySelector('.sidebar')); translateRoot($('#crumbs')); translateRoot(document.querySelector('.header')); translateRoot(view); translateRoot($('#modalBox')); }
function setLang(l){ LANG=l; document.documentElement.lang=l; document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l)); translateAll(); }
$('#langSwitch').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setLang(b.dataset.lang);});
// re-apply translation whenever the view or a modal re-renders
new MutationObserver(()=>{ if(LANG!=='en') translateAll(); }).observe(document.body,{childList:true,subtree:true});

// boot
if(!location.hash) location.hash='#/news';
